<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thailand">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E4EEF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B161B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<title>Thailand-Reise Februar 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Sans+Thai:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Plan «Seekarte»: die Farben einer Seekarte. Flachwasser-Blau als Grund, Weiss wie tiefes Wasser für Karten,
   Sand für Land, Magenta für alles, was zu eurer Route gehört. Woche 1 = Lagune (Phuket-Nord), Woche 2 = Regenwald (Khao Lak).
   Schrift: Bai Jamjuree (thailändische Schriftgiesserei) für Titel und Zahlen, IBM Plex für Text; Gewässer kursiv wie auf Karten.
   Layout: eine ruhige Spalte (max. 720 px) für den Daumen, Tab-Leiste unten, Zusammenfassung vor Details. */
:root{
  --bg:#E4EEF1; --surface:#FBFDFD; --surface-2:#D8E6EA; --ink:#12232C; --ink-2:#4A5E68; --line:#C8D8DD;
  --accent:#AE2277; --accent-ink:#FFFFFF; --link:#0A5E86;
  --sea:#F7FBFC; --shoal:#C6E0EA; --land:#EDE1C1; --coast:#7A6D50; --water-ink:#2B6889;
  --w1:#0A7681; --w1-soft:#D3EBEC; --w2:#3B7633; --w2-soft:#DDEAD6; --travel:#4B5A8A; --travel-soft:#E0E4F0;
  --swim:#1F66AD; --bike:#C2551A; --run:#7449AD; --other:#66757D;
  --open-bg:#F6DFDB; --open-ink:#8B2C25; --res-bg:#F5E8C8; --res-ink:#73500C; --paid-bg:#D8EDE0; --paid-ink:#1D5B37;
  --shadow:0 1px 2px rgba(18,35,44,.06),0 6px 18px rgba(18,35,44,.07);
  --font-display:"Bai Jamjuree","IBM Plex Sans",system-ui,sans-serif;
  --font-body:"IBM Plex Sans","IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-thai:"IBM Plex Sans Thai","Bai Jamjuree",system-ui,sans-serif;
  --r:16px; --r-sm:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B161B; --surface:#12212A; --surface-2:#1A2D36; --ink:#E1EDF1; --ink-2:#9AB0BA; --line:#26404B;
    --accent:#EE7BC2; --accent-ink:#2B0719; --link:#6CC3E6;
    --sea:#0F222B; --shoal:#18394A; --land:#2E3227; --coast:#8D8467; --water-ink:#7FB7D3;
    --w1:#4CC3CC; --w1-soft:#0E2E31; --w2:#8DC67F; --w2-soft:#192C16; --travel:#A9B5E6; --travel-soft:#222A40;
    --swim:#6EA7E5; --bike:#F0944D; --run:#B898EA; --other:#93A3AB;
    --open-bg:#3A1F1C; --open-ink:#F2ADA4; --res-bg:#3A2E14; --res-ink:#F1CF86; --paid-bg:#163324; --paid-ink:#97DDB2;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B161B; --surface:#12212A; --surface-2:#1A2D36; --ink:#E1EDF1; --ink-2:#9AB0BA; --line:#26404B;
  --accent:#EE7BC2; --accent-ink:#2B0719; --link:#6CC3E6;
  --sea:#0F222B; --shoal:#18394A; --land:#2E3227; --coast:#8D8467; --water-ink:#7FB7D3;
  --w1:#4CC3CC; --w1-soft:#0E2E31; --w2:#8DC67F; --w2-soft:#192C16; --travel:#A9B5E6; --travel-soft:#222A40;
  --swim:#6EA7E5; --bike:#F0944D; --run:#B898EA; --other:#93A3AB;
  --open-bg:#3A1F1C; --open-ink:#F2ADA4; --res-bg:#3A2E14; --res-ink:#F1CF86; --paid-bg:#163324; --paid-ink:#97DDB2;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
body.noscroll{overflow:hidden}
[hidden]{display:none!important}
body.locked .tabbar{display:none}
body.locked{padding-bottom:0}
.lock{min-height:72vh;display:grid;place-items:center;padding:28px 0}
.lock-card{width:100%;max-width:360px;text-align:center;display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 20px;box-shadow:var(--shadow)}
.lock-card>svg{width:42px;height:42px;margin:0 auto;color:var(--accent)}
.lock-card h1{font-size:26px}
.lock-in{font-size:28px!important;letter-spacing:.45em;text-align:center;font-variant-numeric:tabular-nums;padding-left:.45em!important}
.remember{display:flex;gap:8px;align-items:center;justify-content:center;font-size:14px;color:var(--ink-2)}
.remember input{width:18px;height:18px;min-height:0}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--link)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
[lang="th"],.thai{font-family:var(--font-thai)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13.5px;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sp{flex:1}

/* App-Leiste */
.appbar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
@supports (backdrop-filter:blur(8px)){.appbar{background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px)}}
.appbar .wrap{display:flex;align-items:center;gap:12px;min-height:54px}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-family:var(--font-display);font-weight:600;font-size:18px;letter-spacing:.01em}
.brand span{font-size:12px;color:var(--ink-2)}
.sync{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;max-width:58vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--other);flex:none}
.sync.s-ok::before{background:var(--paid-ink)}
.sync.s-wait::before{background:var(--accent);animation:pulse 1s ease-in-out infinite}
.sync.s-warn::before{background:var(--open-ink)}
@keyframes pulse{50%{opacity:.35}}
.banner{margin:12px 0 0;padding:10px 14px;border-radius:var(--r-sm);background:var(--res-bg);color:var(--res-ink);font-size:14px}

/* Tab-Leiste */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(7,1fr);padding:0 4px}
.tab{appearance:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;color:var(--ink-2);font-size:10.5px;font-weight:500;cursor:pointer;min-height:56px;justify-content:center;text-decoration:none}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{color:var(--accent)}
.tab[aria-current="page"] span{font-weight:600}
@media (min-width:760px){.tab{font-size:12px;flex-direction:row;gap:7px}.tab svg{width:20px;height:20px}}

main{outline:none}
.view{padding:18px 0 28px;display:flex;flex-direction:column;gap:18px}
.vh{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.vh h1{font-size:28px}
.vh p{flex-basis:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card h2{font-size:19px;margin-bottom:10px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:6px 0 -4px}
.sec-h h2{font-size:20px}
.sec-h .muted{font-size:13px}

/* Knöpfe */
.btn{appearance:none;border:1px solid transparent;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:999px;padding:10px 16px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-size:15px}
.btn:hover{filter:brightness(1.04)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn.danger{color:var(--open-ink);border-color:var(--open-bg)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;width:38px;height:38px;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink-2);flex:none;font-size:18px;line-height:1}
.icon-btn svg{width:18px;height:18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;white-space:nowrap;cursor:pointer;font-size:14px;color:var(--ink);min-height:38px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .muted{color:inherit;opacity:.7}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{appearance:none;border:0;background:none;border-radius:9px;padding:9px 6px;font-weight:600;cursor:pointer;color:var(--ink-2);min-height:42px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Status */
.pill{appearance:none;border:0;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:5px;min-height:32px}
.pill::after{content:"↻";font-weight:400;opacity:.7}
.pill.static{cursor:default}.pill.static::after{content:none}
.st-open{background:var(--open-bg);color:var(--open-ink)}
.st-res{background:var(--res-bg);color:var(--res-ink)}
.st-paid{background:var(--paid-bg);color:var(--paid-ink)}
.badge{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.02em;border-radius:6px;padding:1px 7px;background:var(--surface-2);color:var(--ink-2);vertical-align:2px}
.badge.est{background:var(--res-bg);color:var(--res-ink)}

/* Regionen & Sportarten */
.r-travel{--rc:var(--travel);--rcs:var(--travel-soft)}
.r-w1{--rc:var(--w1);--rcs:var(--w1-soft)}
.r-w2{--rc:var(--w2);--rcs:var(--w2-soft)}
.r-switch{--rc:var(--w2);--rcs:var(--w2-soft);--rg:linear-gradient(135deg,var(--w1) 50%,var(--w2) 50%)}
.r-home{--rc:var(--travel);--rcs:var(--travel-soft);--rg:linear-gradient(135deg,var(--w2) 50%,var(--travel) 50%)}
.s-bike{--sc:var(--bike)} .s-run{--sc:var(--run)} .s-swim{--sc:var(--swim)} .s-other{--sc:var(--other)}

/* Seekarte (Hero) */
.chart{display:grid;gap:10px;padding-top:2px}
.chart-frame{position:relative;padding:7px;background:var(--surface);border:1px solid var(--ink);border-radius:3px;box-shadow:var(--shadow)}
.chart-frame::before{content:"";position:absolute;inset:2px;pointer-events:none;background:
  repeating-linear-gradient(90deg,var(--ink) 0 14px,transparent 14px 28px) top left/100% 2px no-repeat,
  repeating-linear-gradient(90deg,var(--ink) 0 14px,transparent 14px 28px) bottom left/100% 2px no-repeat,
  repeating-linear-gradient(180deg,var(--ink) 0 14px,transparent 14px 28px) top left/2px 100% no-repeat,
  repeating-linear-gradient(180deg,var(--ink) 0 14px,transparent 14px 28px) top right/2px 100% no-repeat}
.chart-svg{display:block;width:100%;height:auto;border:1px solid var(--ink)}
.chart-svg .sea{fill:var(--sea)}
.chart-svg .shoal path,.chart-svg .shoal ellipse{fill:var(--shoal);stroke:var(--shoal);stroke-width:10;stroke-linejoin:round}
.chart-svg .land path,.chart-svg .land ellipse{fill:var(--land);stroke:var(--coast);stroke-width:.8;stroke-linejoin:round}
.chart-svg text{font-family:var(--font-body)}
.chart-svg .water{font-style:italic;fill:var(--water-ink);font-size:10px;letter-spacing:.06em}
.chart-svg .water.big{font-size:11.5px;letter-spacing:.12em}
.chart-svg .lbl{font-size:10.5px;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:3px;stroke-linejoin:round}
.chart-svg .lbl.land{stroke:var(--land)}
.chart-svg .lbl.sm{font-size:9px;fill:var(--ink-2)}
.chart-svg .lbl.big{font-size:12px;letter-spacing:.1em}
.chart-svg .base-lbl{font-family:var(--font-display);font-weight:700;font-size:12px}
.chart-svg .snd{font-style:italic;font-size:9.5px;font-weight:600;fill:var(--accent);paint-order:stroke;stroke:var(--sea);stroke-width:3px;stroke-linejoin:round}
.chart-svg .track{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chart-svg .boat{fill:none;stroke:var(--accent);stroke-width:1.3;stroke-dasharray:4 3;opacity:.85}
.chart-svg .boat-tip{fill:none;stroke:var(--accent);stroke-width:1.3}
.chart-svg .pt{fill:var(--ink);stroke:var(--sea);stroke-width:1.2}
.chart-svg .pt.stop{fill:var(--accent)}
.chart-svg .pt.air{fill:var(--sea);stroke:var(--ink);stroke-width:1.6}
.chart-svg .base.w1{fill:var(--w1)}.chart-svg .base.w2{fill:var(--w2)}
.chart-svg .base-ring{fill:none;stroke-width:1.6}.chart-svg .base-ring.w1{stroke:var(--w1)}.chart-svg .base-ring.w2{stroke:var(--w2)}
.chart-svg .scale line{stroke:var(--ink);stroke-width:1.2}
.cartouche{position:absolute;left:14px;bottom:14px;max-width:47%;background:var(--surface);border:1px solid var(--ink);padding:8px 10px 9px;display:grid;gap:2px;box-shadow:3px 3px 0 color-mix(in srgb,var(--ink) 16%,transparent)}
.cartouche h1{font-size:clamp(15px,4.6vw,21px);line-height:1.05;letter-spacing:.01em;white-space:nowrap}
.ct-sub{font-size:11.5px;color:var(--ink-2);font-style:italic;line-height:1.3}
.ct-count{display:flex;align-items:center;gap:7px;margin-top:5px;padding-top:5px;border-top:1px solid var(--line)}
.ct-count b{font-family:var(--font-display);font-weight:700;font-size:clamp(24px,7.4vw,34px);line-height:.9;color:var(--accent);font-variant-numeric:tabular-nums}
.ct-count span{font-size:11.5px;line-height:1.2}
@media (max-width:360px){.cartouche{left:12px;bottom:12px;padding:6px 8px 7px}.ct-sub{font-size:10.5px}}
.chart-key{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-2);align-items:center}
.chart-key i{display:inline-block;width:18px;height:0;border-top:2px solid var(--accent);vertical-align:3px;margin-right:6px}
.chart-key i.k-boat{border-top:1.5px dashed var(--accent)}
.chart-key em{font-style:italic;font-weight:600;color:var(--accent);margin-right:5px}
.ribbon{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin-top:6px}
.rb{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:inherit}
.rb .cell{width:100%;height:30px;border-radius:4px;background:var(--rc);display:grid;place-items:center;color:var(--surface);font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.rb.r-switch .cell,.rb.r-home .cell{background:var(--rg)}
.rb.is-today .cell{outline:2.5px solid var(--accent);outline-offset:2px}
.rb .dots{display:flex;gap:2px;min-height:6px;flex-wrap:wrap;justify-content:center}
.dot{width:6px;height:6px;border-radius:50%;background:var(--sc);display:inline-block}
.rlabels{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin-top:-2px;font-size:11.5px;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--rc,var(--sc))}
.legend i.dot{border-radius:50%;width:8px;height:8px}

/* Reiseverlauf */
.itin{list-style:none;margin:0;padding:0;display:grid}
.itin li{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:8px 0 8px 22px;position:relative}
.itin li::before{content:"";position:absolute;left:5px;top:0;bottom:0;border-left:2px solid var(--accent)}
.itin li:first-child::before{top:15px}
.itin li:last-child::before{bottom:auto;height:15px}
.itin li::after{content:"";position:absolute;left:0;top:10px;width:12px;height:12px;border-radius:50%;background:var(--rg,var(--rc));box-shadow:0 0 0 2.5px var(--surface)}
.it-d{font-family:var(--font-display);font-weight:600;font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.it-t{display:flex;flex-direction:column;min-width:0}
.it-t b{font-weight:600}
.it-t .muted{font-size:13.5px}

/* Kacheln */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile .k{font-size:12px;color:var(--ink-2);font-weight:500;letter-spacing:.02em}
.tile .v{font-family:var(--font-display);font-size:21px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .d{font-size:12.5px;color:var(--ink-2);line-height:1.35}
.tile.r-w1{border-left:4px solid var(--w1)}
.tile.r-w2{border-left:4px solid var(--w2)}

/* Fortschritt */
.prog{display:grid;gap:14px}
.prow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline;text-decoration:none;color:inherit}
.prow b{font-weight:600}
.prow .muted{font-size:13px;text-align:right}
.bar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.bar .g{background:var(--paid-ink)}.bar .y{background:color-mix(in srgb,var(--res-ink) 70%,var(--res-bg))}.bar .r{background:var(--open-ink);opacity:.55}.bar .a{background:var(--ink)}

/* Listen mit Häkchen */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.li .meta{font-size:12.5px;color:var(--ink-2);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.li.is-done .txt>.t{color:var(--ink-2);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink-2) 60%,transparent)}
.chk{appearance:none;flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink-2);background:transparent;cursor:pointer;display:grid;place-items:center;margin-top:-1px;padding:0}
.chk svg{width:15px;height:15px;opacity:0}
.chk[aria-checked="true"]{background:var(--paid-ink);border-color:var(--paid-ink);color:var(--surface)}
.chk[aria-checked="true"] svg{opacity:1}
.chk:disabled{cursor:default;opacity:.6}
.x{appearance:none;border:0;background:none;color:var(--ink-2);cursor:pointer;width:32px;height:32px;border-radius:50%;flex:none;font-size:20px;line-height:1;margin:-4px -6px 0 0}
.x:hover{background:var(--surface-2)}
.due{font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--surface-2);color:var(--ink-2)}
.due.late{background:var(--open-bg);color:var(--open-ink)}
.due.soon{background:var(--res-bg);color:var(--res-ink)}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow input{flex:1;min-width:0}

/* Formulare */
input[type=text],input[type=url],input[type=date],input[type=number],input:not([type]),select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px;min-height:44px;color:var(--ink)}
textarea{resize:vertical;line-height:1.45}
.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2);font-weight:500}
.f>span{padding-left:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12.5px;color:var(--ink-2)}
.hint.warn{color:var(--open-ink);font-weight:500}

/* Buchungen */
.bk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);border-left:4px solid var(--bk-c,var(--line))}
.bk.k-flug{--bk-c:var(--travel)} .bk.k-unterkunft{--bk-c:var(--w1)} .bk.k-velo{--bk-c:var(--bike)} .bk.k-transfer{--bk-c:var(--other)} .bk.k-training{--bk-c:var(--swim)} .bk.k-ausflug{--bk-c:var(--accent)}
.bk-top{display:flex;gap:10px;align-items:flex-start}
.bk-top h3{font-size:17px;font-weight:600}
.bk-top .muted{font-size:13.5px;margin-top:2px}
.bk dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0}
.bk dt{font-size:11.5px;color:var(--ink-2);font-weight:500}
.bk dd{margin:0;font-weight:500;display:flex;align-items:center;gap:6px;min-width:0;overflow-wrap:anywhere}
.bk .notes{font-size:14px;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
.files{display:flex;flex-wrap:wrap;gap:8px}
.file{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:4px 4px 4px 4px;max-width:100%;background:var(--bg)}
.file img{width:44px;height:44px;object-fit:cover;border-radius:7px;display:block;background:var(--surface-2)}
.file .ph{width:44px;height:44px;border-radius:7px;display:grid;place-items:center;background:var(--open-bg);color:var(--open-ink);font-size:11px;font-weight:700}
.file a,.file button.open{color:var(--ink);text-decoration:none;font-size:13px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.bk-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--ink-2)}

/* Tage */
.weeks{display:grid;gap:10px}
@media (min-width:640px){.weeks{grid-template-columns:1fr 1fr}}
.week{border-radius:14px;padding:12px 14px;background:var(--rcs);border:1px solid color-mix(in srgb,var(--rc) 25%,transparent)}
.week h3{font-size:16px;margin-bottom:8px}
.sbars{display:grid;gap:6px}
.sbar{display:grid;grid-template-columns:86px 1fr auto;gap:8px;align-items:center;font-size:13px}
.sbar .t{height:8px;border-radius:99px;background:color-mix(in srgb,var(--ink) 8%,transparent);overflow:hidden}
.sbar .t span{display:block;height:100%;background:var(--sc);border-radius:99px}
.sbar .h{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;min-width:44px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;scroll-margin-top:68px;box-shadow:var(--shadow)}
.day>header{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--rcs);border-bottom:1px solid var(--line)}
.day.is-today{outline:2.5px solid var(--accent);outline-offset:-1px}
.dd{display:flex;flex-direction:column;align-items:center;justify-content:center;width:50px;height:50px;border-radius:12px;background:var(--rc);color:var(--surface);flex:none;line-height:1}
.dd .wd{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;opacity:.9}
.dd .dn{font-family:var(--font-display);font-size:18px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.r-switch .dd,.r-home .dd{background:var(--rg)}
.day h3{font-size:17px}
.day .reg{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.dbody{padding:4px 14px 14px;display:grid;gap:4px}
@media (min-width:640px){.dbody{grid-template-columns:1.2fr 1fr;gap:18px}}
.dlbl{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:10px 0 4px}
.sess{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.sess:first-of-type{border-top:0}
.sess .bar-s{width:4px;align-self:stretch;border-radius:3px;background:var(--sc);flex:none}
.sess .txt{flex:1;min-width:0}
.sess b{font-weight:600}
.sess .det{font-size:13.5px;color:var(--ink-2)}
.sess .alt{font-size:13px;color:var(--ink-2);margin-top:3px}
.sess .alt b{font-weight:600;color:var(--ink);margin-right:4px}
.sess.is-done b,.sess.is-done .where{text-decoration:line-through;color:var(--ink-2)}
.dtxt{font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.sedit{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;background:var(--bg)}
.sedit .row{display:grid;grid-template-columns:1.2fr .8fr auto;gap:8px;align-items:end}

/* Infos */
.ihead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ihead h1{font-size:30px}
.ihead .th-name{font-size:22px;color:var(--ink-2)}
.isec{scroll-margin-top:68px}
.isec>h2{font-size:20px;margin:4px 0 10px;display:flex;align-items:center;gap:10px}
.isec>h2::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--rc,var(--accent));flex:none}
.facts{display:grid;gap:10px}
@media (min-width:640px){.facts{grid-template-columns:1fr 1fr}}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.fact h3{font-size:15.5px;font-family:var(--font-body);font-weight:600}
.fact p{font-size:14.5px;overflow-wrap:anywhere}
.fact .tip{font-size:13.5px;color:var(--ink);background:var(--res-bg);border-radius:8px;padding:6px 9px}
.srcs{display:flex;gap:6px;flex-wrap:wrap}
.src{font-size:12px;color:var(--link);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.src::before{content:"↗ "}
.thbtn{align-self:flex-start;appearance:none;border:1px dashed var(--ink-2);background:transparent;border-radius:9px;padding:4px 10px;cursor:pointer;font-family:var(--font-thai);font-size:16px;color:var(--ink)}
.thbtn small{font-family:var(--font-body);font-size:11px;color:var(--ink-2);margin-left:6px}
.tel{font-weight:600;white-space:nowrap}
.srclist{font-size:13px;color:var(--ink-2);display:grid;gap:4px;padding-left:18px;margin:0}
.srclist a{overflow-wrap:anywhere}

/* Budget */
.btot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.brow{display:grid;grid-template-columns:1fr 112px;gap:6px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.brow:first-child{border-top:0}
.brow .lbl{font-weight:600}
.brow .vals{grid-column:1/-1;font-size:12.5px;color:var(--ink-2);display:flex;gap:10px;flex-wrap:wrap}
.brow input{text-align:right;min-height:40px;padding:8px 10px}
.bbar{grid-column:1/-1;position:relative;height:10px;border-radius:99px;background:var(--surface-2);overflow:visible;display:flex}
.bbar .ist{background:var(--ink);border-radius:99px 0 0 99px;height:100%}
.bbar .ver{height:100%;background:repeating-linear-gradient(135deg,var(--accent) 0 4px,transparent 4px 7px);opacity:.9}
.bbar .soll{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--open-ink);border-radius:2px}
.bbar.over .ist{background:var(--open-ink)}
.fx{display:grid;grid-template-columns:1fr 120px;gap:8px 12px;align-items:center}

/* Sheet */
#sheet-root{position:fixed;inset:0;z-index:60;display:none}
#sheet-root.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(10,20,18,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;display:flex;flex-direction:column;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.2);margin:0 auto;max-width:640px}
@media (min-width:700px){.sheet{bottom:auto;top:50%;transform:translateY(-50%);border-radius:20px;max-height:86%}}
.sheet>header{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.sheet>header h2{font-size:20px;flex:1}
.sheet-body{padding:4px 16px 12px;overflow:auto;display:grid;gap:12px}
.sheet>footer{display:flex;gap:8px;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex-wrap:wrap}
.th-big{font-family:var(--font-thai);font-size:clamp(34px,9vw,56px);line-height:1.35;text-align:center;padding:10px 0;overflow-wrap:anywhere}
.lightbox{width:100%;height:auto;border-radius:12px;display:block}

#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:70;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.skel{height:64px;border-radius:14px;background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;animation:sk 1.4s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================================================================ Erweiterung: Karte, Entdecken, Buchen */
:root{ --food:#A3620F;
  --il-sky:#EAF3F6; --il-sky2:#F6E3CF; --il-sea:#7FBBD0; --il-sea2:#4F98B5; --il-sand:#EDDDB4; --il-sun:#F1B43A; --il-leaf:#3E7A35; --il-leaf2:#5E9B48; --il-trunk:#8A6A45; --il-rock:#8D9A9E; --il-rock2:#A8B4B6; --il-white:#FFFFFF; --il-ink:#24343C; --il-night:#20323F; --il-h1:#F1D9B5; --il-h2:#CFE3DA; --il-h3:#EDC9C3; }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --food:#E2A657;
  --il-sky:#1A2C35; --il-sky2:#3A2C24; --il-sea:#2F6276; --il-sea2:#24505F; --il-sand:#5A5038; --il-sun:#D69A2C; --il-leaf:#4F8A45; --il-leaf2:#5F9A52; --il-trunk:#7A5D3E; --il-rock:#5F6B70; --il-rock2:#6F7C80; --il-white:#DCE6EA; --il-ink:#0E1A20; --il-night:#0F1C24; --il-h1:#6E5B42; --il-h2:#3F5A50; --il-h3:#6A4744; } }
:root[data-theme="dark"]{ --food:#E2A657;
  --il-sky:#1A2C35; --il-sky2:#3A2C24; --il-sea:#2F6276; --il-sea2:#24505F; --il-sand:#5A5038; --il-sun:#D69A2C; --il-leaf:#4F8A45; --il-leaf2:#5F9A52; --il-trunk:#7A5D3E; --il-rock:#5F6B70; --il-rock2:#6F7C80; --il-white:#DCE6EA; --il-ink:#0E1A20; --il-night:#0F1C24; --il-h1:#6E5B42; --il-h2:#3F5A50; --il-h3:#6A4744; }

.seg.seg5{grid-template-columns:repeat(5,1fr)}
.seg.seg5 button{font-size:13.5px;padding:9px 2px}
.badge.pre{background:var(--accent);color:var(--accent-ink)}
.badge.rec{background:var(--paid-bg);color:var(--paid-ink)}
.pill.tiny{min-height:22px;padding:1px 8px;font-size:11.5px;cursor:default}
.chart-key .ck-link{color:var(--link);font-weight:600;text-decoration:none;margin-left:auto}

/* Karte */
.mapview{gap:12px}
.lchips{margin-top:-2px}
.lchip{display:inline-flex;align-items:center;gap:7px}
.lchip i{width:10px;height:10px;border-radius:50%;background:var(--lc);box-shadow:0 0 0 2px var(--surface)}
.lchip[aria-pressed="false"]{color:var(--ink-2);background:transparent;text-decoration:line-through;text-decoration-color:var(--line)}
.lchip[aria-pressed="false"] i{background:transparent;box-shadow:inset 0 0 0 2px var(--lc)}
.lchip[aria-pressed="true"]{background:var(--surface);color:var(--ink);border-color:var(--lc)}
.mapbox{position:relative;height:max(340px,calc(100vh - 330px));height:max(340px,calc(100svh - 330px));max-height:720px;border:1px solid var(--ink);border-radius:4px;overflow:hidden;background:var(--sea);box-shadow:var(--shadow);margin:0 calc(-1 * min(12px, 3vw))}
@media (min-width:760px){.mapbox{margin:0}}
.map-vh h1{font-size:24px}
.map-vh p{margin-top:2px}
.mapsvg{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;font-family:var(--font-body)}
.mapsvg:active{cursor:grabbing}
.m-sea{fill:var(--sea)}
.m-grat{fill:none;stroke:var(--shoal);stroke-width:.8;vector-effect:non-scaling-stroke;opacity:.9}
.m-shoal{fill:none;stroke:var(--shoal);stroke-width:9;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.m-land{fill:var(--land);stroke:var(--coast);stroke-width:1;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.m-road{fill:none;stroke:var(--coast);stroke-width:1.1;opacity:.42;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.m-rt{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.92}
.m-rt.L-rad{stroke:var(--bike)} .m-rt.L-lauf{stroke:var(--run);stroke-dasharray:1 5.5;stroke-width:4} .m-rt.L-weg{stroke:var(--travel);stroke-width:2.6}
.m-rt.boat{stroke:var(--water-ink);stroke-dasharray:7 5;stroke-width:2}
.m-rt.est{opacity:.75}
.m-rt.sel{stroke-width:6;opacity:1;filter:drop-shadow(0 0 3px var(--sea))}
.m-rt.L-lauf.sel{stroke-width:6.5}
.m-hit{fill:none;stroke:transparent;stroke-width:18;vector-effect:non-scaling-stroke;pointer-events:stroke}
.off-rad [data-rl="rad"],.off-lauf [data-rl="lauf"],.off-weg [data-rl="weg"]{display:none}
.mk{cursor:pointer}
.mk circle{fill:var(--surface);stroke:var(--lc);stroke-width:2.2}
.mk use{color:var(--lc)}
.mk.sel circle:not(.ring){fill:var(--lc)} .mk.sel use{color:var(--surface)}
.mk .ring{fill:none;stroke:var(--lc);stroke-width:2;opacity:.45}
.mk.cl circle{fill:var(--lc);stroke:var(--surface);stroke-width:2.5}
.mk.cl text{fill:var(--surface);font-weight:700;font-size:12px}
.L-base{--lc:var(--accent)} .L-rad{--lc:var(--bike)} .L-lauf{--lc:var(--run)} .L-ziel{--lc:var(--swim)} .L-weg{--lc:var(--travel)} .L-essen{--lc:var(--food)} .L-info{--lc:var(--ink-2)}
.mlbl{font-size:11.5px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:3.4px;stroke-linejoin:round;pointer-events:none}
.mlbl.sel{fill:var(--ink);font-weight:700}
.mlbl.area{fill:var(--accent);font-family:var(--font-display);font-size:13px;font-weight:600;letter-spacing:.02em}
.mlbl.water{fill:var(--water-ink);font-style:italic;font-weight:500;letter-spacing:.06em;stroke-width:2.6px}
.mlbl.water.big{font-size:13px;letter-spacing:.2em}
.mlbl.water.small{font-size:10.5px}
.mlbl.landl{fill:var(--coast);font-family:var(--font-display);font-size:12px;letter-spacing:.24em;text-transform:uppercase;stroke:var(--land);font-weight:600}
.map-ctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px}
.map-ctl .icon-btn{width:40px;height:40px;font-size:22px;box-shadow:var(--shadow);color:var(--ink)}
.map-scale{position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;gap:2px;font-size:11px;font-weight:600;color:var(--ink-2);background:color-mix(in srgb,var(--surface) 80%,transparent);padding:4px 7px;border-radius:6px;pointer-events:none}
.map-scale i{display:block;height:6px;border:1.5px solid var(--ink);border-top:0}
.map-note{margin:-2px 0 0}
.mapinfo{display:flex;flex-direction:column;gap:10px}
.mapinfo.empty-info{background:transparent;box-shadow:none;border-style:dashed;padding:12px 14px}
.mapinfo p{margin:0}
.mi-h{display:flex;align-items:flex-start;gap:10px}
.mi-h>div{flex:1;min-width:0}
.mi-h h3{font-size:17px;margin:0}
.mi-h p{margin:2px 0 0}
.mi-ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--lc);color:var(--surface);flex:none}
.rline{display:inline-block;width:22px;height:0;border-top:3.5px solid var(--lc);border-radius:2px;flex:none;margin-top:12px}
.rline.L-lauf{border-top-style:dotted;border-top-width:4px}
.rline.boat{border-top:2.5px dashed var(--water-ink)}
.mi-act,.fl-act,.exc-act{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.feats{display:flex;flex-wrap:wrap;gap:6px}
.feat{font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--w1-soft);color:var(--ink)}
.feat.no{background:var(--open-bg);color:var(--open-ink)}
.feat.soft{background:var(--surface-2);color:var(--ink-2);font-weight:500}
ul.food{margin:0;padding-left:18px;display:grid;gap:4px}
ul.food a{color:var(--link);font-weight:600;text-decoration:none}
.maplist{display:flex;flex-direction:column;gap:10px}
.ml-h{font-size:18px;margin:4px 0 0}
.ml-g h3{font-size:13px;color:var(--ink-2);margin:0 0 6px;display:flex;align-items:center;gap:7px;font-weight:600}
.ml-g h3::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--lc)}
.ml-items{display:flex;flex-wrap:wrap;gap:6px}
.ml-items .chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:5px 11px;font-size:13.5px;white-space:normal;text-align:left}
.ml-items .chip svg{color:var(--lc);flex:none}
.ml-items .chip .rline{margin-top:0}

/* Entdecken */
.exc-grid{display:grid;gap:14px}
@media (min-width:700px){.exc-grid{grid-template-columns:1fr 1fr}}
.exc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;scroll-margin-top:72px}
.exc-art{position:relative;height:124px;border-bottom:1px solid var(--line)}
.exc-art .ill{display:block;width:100%;height:100%}
.exc-w{position:absolute;left:10px;top:10px;font-size:11.5px;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:6px;background:var(--surface);color:var(--rc,var(--ink));box-shadow:var(--shadow)}
.exc.r-w1{--rc:var(--w1)} .exc.r-w2{--rc:var(--w2)} .exc.r-switch{--rc:var(--travel)}
.loc{position:absolute;right:8px;top:8px;width:50px;height:64px;border-radius:6px;border:1px solid var(--ink);background:var(--sea);box-shadow:var(--shadow)}
.loc-sea{fill:var(--sea)} .loc-landp{fill:var(--land);stroke:var(--coast);stroke-width:1.2}
.loc-dot{fill:var(--accent)} .loc-ring{fill:none;stroke:var(--accent);stroke-width:3;opacity:.5}
.exc-body{padding:13px 14px 14px;display:flex;flex-direction:column;gap:9px;flex:1}
.exc-body h3{font-size:18px;margin:0}
.exc-body p{margin:0}
.exc-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:-3px}
.exc-f{margin:0;padding-left:18px;font-size:14px;color:var(--ink-2);display:grid;gap:3px}
.exc-go{display:flex;gap:10px;align-items:flex-start;font-size:14px;background:var(--surface-2);border-radius:10px;padding:8px 10px}
.go-ic{color:var(--ink);flex:none;margin-top:1px}

.ill .i-sky{fill:var(--il-sky)} .ill .i-sky2{fill:var(--il-sky2)} .ill .i-night{fill:var(--il-night)}

.ill .i-wave{fill:none;stroke:var(--il-white);stroke-width:2.2;stroke-linecap:round;opacity:.8}
.ill .i-wake{fill:none;stroke:var(--il-white);stroke-width:2.5;stroke-linecap:round;opacity:.85}

.ill .i-bulb{fill:var(--il-sun)} .ill .i-lamp{fill:var(--accent)}

/* Flüge, Hotels, Parken, Vorab */
.fl,.ht{display:flex;flex-direction:column;gap:10px}
.fl p,.ht p{margin:0}
.fl-top,.ht-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.fl-top h3,.ht-top h3{font-size:18px;margin:0}
.fl-top p,.ht-top p{margin:2px 0 0}
.fl.nofit{opacity:.82;border-style:dashed}
.fl-legs{display:grid;gap:8px;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.leg{display:flex;gap:12px;align-items:baseline}

.ht-price{display:flex;flex-direction:column;gap:2px}
.ht-sec{display:flex;flex-direction:column;gap:12px}
ol.steps{margin:0;padding-left:20px;display:grid;gap:6px}
ul.plist{list-style:none;margin:0;padding:0;display:grid;gap:0}
ul.plist li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
ul.plist li:last-child{border-bottom:0}
ol.adv{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.adv-i{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.adv-i p{margin:2px 0 0}
.adv-r{display:flex;gap:8px;align-items:center;flex:none}
.lock-card{grid-template-columns:minmax(0,1fr)}
.lock-card .lock-in{width:100%;min-width:0}

.appbar{padding-top:env(safe-area-inset-top)}

    H = [(H[0]+a)|0,(H[1]+b)|0,(H[2]+c)|0,(H[3]+d)|0,(H[4]+e)|0,(H[5]+f)|0,(H[6]+g)|0,(H[7]+h)|0];
  }
  return H.map(x => (x>>>0).toString(16).padStart(8,'0')).join('');
}
const UNLOCK_KEY = 'th27-unlock';
const LOCK = { mem:'', tries:0, until:0 };
function lockCfg(){ const s=S.docs.settings; return (s && s.lockOn && s.lockHash && s.lockSalt) ? s : null; }
function storedUnlock(){ try{ return localStorage.getItem(UNLOCK_KEY) || sessionStorage.getItem(UNLOCK_KEY) || ''; }catch(e){ return ''; } }
function rememberUnlock(h, persist){ LOCK.mem = h; try{ (persist ? localStorage : sessionStorage).setItem(UNLOCK_KEY, h); }catch(e){} }
function forgetUnlock(){ LOCK.mem = ''; try{ localStorage.removeItem(UNLOCK_KEY); sessionStorage.removeItem(UNLOCK_KEY); }catch(e){} }
function isLocked(){ const c=lockCfg(); if(!c) return false; return (LOCK.mem || storedUnlock()) !== c.lockHash; }
function lockScreen(){

  return '<div class="lock"><form class="lock-card" id="lock-form" novalidate>'+

async function tryUnlock(){
  const c = lockCfg(); const inp = $('#lock-in'), msg = $('#lock-msg'); if(!c || !inp) { render(); return; }
  const now = Date.now();
  if(LOCK.until > now){ msg.textContent = 'Zu viele Versuche – bitte '+Math.ceil((LOCK.until-now)/1000)+' s warten.'; return; }
  const code = inp.value.trim();
  if(!/^\d{4,8}$/.test(code)){ msg.textContent = 'Bitte 4 bis 8 Ziffern eingeben.'; return; }
  if(sha256hex(c.lockSalt+':'+code) === c.lockHash){ LOCK.tries=0; rememberUnlock(c.lockHash, $('#lock-remember')?.checked !== false); inp.blur(); render(); return; }
  LOCK.tries++; inp.value='';
  if(LOCK.tries>=5){ LOCK.until = now + 30000; LOCK.tries = 0; msg.textContent = 'Falscher Code. Bitte 30 Sekunden warten.'; }
  else msg.textContent = 'Falscher Code.';
}
function randHex(n){ const a = new Uint8Array(n); try{ crypto.getRandomValues(a); }catch(e){ for(let i=0;i<n;i++) a[i]=Math.floor(Math.random()*256); } return Array.from(a, b => b.toString(16).padStart(2,'0')).join(''); }

    '<label class="f"><span>Code wiederholen</span><input name="c2" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="new-password" maxlength="8"></label>'+
    '<p class="hint">Sichtschutz beim Öffnen. Den echten Schutz übernimmt dein Claude-Login. Teile den Code nur mündlich oder per Nachricht – speichere ihn nicht auf der Seite.</p>',
    { submitLabel:'Code speichern', onSubmit: async form => {
      const c1 = form.elements.c1.value.trim(), c2 = form.elements.c2.value.trim();

      if(ok){ rememberUnlock(hash, true); toast('Zugangscode gespeichert'); }

    }});
}

function editBooking(id, tpl){

async function deleteBooking(id){
  const b = itemOf('bookings',id); if(!b) return;
  const files = Array.isArray(b.files)?b.files:[];
  const ok = await confirmSheet('Buchung löschen?', '«'+(b.title||'')+'»'+(files.length?' und '+files.length+' angehängte Datei(en)':'')+' werden für euch beide entfernt.', 'Löschen');
  if(!ok) return;
  if(S.assets) for(const f of files){ try{ await S.assets.delete(f.id); }catch(e){} }
  if(await patch('bookings',{items:{[id]:Object.assign({deleted:true, files:[]},stamp())}})) toast('Gelöscht');
}
async function uploadFiles(id, fileList){
  if(!S.assets){ toast('Hochladen ist nur mit Bearbeitungsrecht möglich.'); return; }
  for(const f of Array.from(fileList||[])){
    const lower = (f.name||'').toLowerCase();
    let type = f.type || (lower.endsWith('.pdf')?'application/pdf':lower.match(/\.jpe?g$/)?'image/jpeg':lower.endsWith('.png')?'image/png':'');
    if(type==='image/jpg') type='image/jpeg';
    if(/heic|heif/.test(type) || /\.hei[cf]$/.test(lower)){ toast('HEIC wird nicht unterstützt – bitte als JPG oder PDF.'); continue; }
    if(!/^(application\/pdf|image\/(png|jpeg|gif|webp))$/.test(type)){ toast('Nur PDF oder Bild (JPG, PNG, WebP, GIF).'); continue; }
    if(f.size>20*1024*1024){ toast('Datei zu gross (max. 20 MB).'); continue; }
    if(type==='application/pdf' && S.user && typeof S.user.isOwner==='function'){ let own=true; try{ own = S.user.isOwner(); if(own && typeof own.then==='function') own = await own; }catch(e){ own=true; } if(own===false){ toast('PDF hochladen kann nur der Besitzer – bitte als Foto oder Screenshot (JPG/PNG).'); continue; } }
    S.uploads++; renderStatus();
    try{
      const r = await S.assets.upload(f,{type});
      const cur = itemOf('bookings',id); const files = (Array.isArray(cur&&cur.files)?cur.files:[]).slice();
      files.push({id:r.id, name:String(f.name||'Datei').slice(0,120), type:r.contentType||type, size:r.sizeBytes||f.size, at:new Date().toISOString(), by:S.me||''});
      if(await patch('bookings',{items:{[id]:Object.assign({files},stamp())}})) toast('Hochgeladen: '+f.name);
    }catch(e){ toast(uploadErr(e)); }
    finally{ S.uploads--; renderStatus(); }
  }
}
function uploadErr(e){ const c=e&&e.code; return ({too_large:'Datei zu gross (max. 20 MB).', unsupported_type:'Dieser Dateityp geht hier nicht – bitte als Foto oder Screenshot (JPG/PNG) hochladen.', quota_or_state:'Speicherplatz für Dateien ist voll.', rate_limited:'Zu viele Uploads – kurz warten.', not_granted:'Hochladen ist nur mit Bearbeitungsrecht möglich.', upstream_auth:'Bitte neu anmelden und nochmals versuchen.'})[c] || 'Hochladen fehlgeschlagen.'; }
async function deleteFile(id,fid){
  const b=itemOf('bookings',id); if(!b) return; const f=(b.files||[]).find(x=>x.id===fid); if(!f) return;
  const ok = await confirmSheet('Datei entfernen?', '«'+(f.name||'Datei')+'» wird für euch beide gelöscht.', 'Entfernen'); if(!ok) return;
  const files=(b.files||[]).filter(x=>x.id!==fid);
  if(await patch('bookings',{items:{[id]:Object.assign({files},stamp())}})){ try{ await S.assets.delete(fid); }catch(e){} toast('Entfernt'); }
}

function budgetCats(){ const b=S.docs.budget; const c=(b&&b.cats&&typeof b.cats==='object')?b.cats:{}; const keys=[...new Set([...Object.keys(DEFAULT_CATS),...Object.keys(c)])]; return keys.map((k,i)=>[k, Object.assign({label:DEFAULT_CATS[k]||k, plan:null, order:(i+1)*10}, (c[k]&&typeof c[k]==='object')?c[k]:{})]).sort((a,b)=>(+a[1].order||0)-(+b[1].order||0)); }
function budgetCalc(){
  const cats = budgetCats(); const per = {}; cats.forEach(([k])=>per[k]={ist:0,ver:0});
  const ensure = k => per[k] || (per[k] = per.sonstiges || (per.sonstiges={ist:0,ver:0}));
  items('bookings').forEach(([,b])=>{ const v=toCHF(b.cost,b.currency); if(!v) return; const p=ensure(b.budgetCat||KIND_TO_CAT[b.kind]||'sonstiges'); if(b.status==='bezahlt') p.ist+=v; else p.ver+=v; });
  items('expenses').forEach(([,e])=>{ const v=toCHF(e.amount,e.currency); if(!v) return; ensure(e.cat||'sonstiges').ist+=v; });
  let ist=0, ver=0, soll=0; cats.forEach(([k,c])=>{ ist+=per[k].ist; ver+=per[k].ver; if(+c.plan>0) soll+=+c.plan; });
  return {cats, per, ist, ver, soll};
}

function kmPath(pts, close){ return 'M'+pts.map(p=>{ const q=P(p[0],p[1]); return q[0].toFixed(2)+','+q[1].toFixed(2); }).join('L')+(close?'Z':''); }

function geo(){
  if(GEO) return GEO;

  for(let la=7.7; la<=9.71; la+=0.1){ const a=P(97.4,la), b=P(99.1,la); grat+='M'+a[0].toFixed(1)+','+a[1].toFixed(1)+'H'+b[0].toFixed(1); }
  const roads = G.roads.map(r=>kmPath(r,false)).join('');

function mapFit(b, animate, padPx){
  const a=P(b[0],b[3]), c=P(b[2],b[1]); const pad=padPx==null?18:padPx;
  const s = Math.min((MV.w-2*pad)/Math.max(c[0]-a[0],0.01), (MV.h-2*pad)/Math.max(c[1]-a[1],0.01));
  mapGo(clampS(s), MV.w/2 - clampS(s)*(a[0]+c[0])/2, MV.h/2 - clampS(s)*(a[1]+c[1])/2, animate);
}
function fitScale(b,pad){ const a=P(b[0],b[3]), c=P(b[2],b[1]); return clampS(Math.min((MV.w-2*pad)/Math.max(c[0]-a[0],0.01), (MV.h-2*pad)/Math.max(c[1]-a[1],0.01))); }
function sMin(){ const b=PRESETS.reise.b, a=P(b[0],b[3]), c=P(b[2],b[1]); return Math.min(MV.w/(c[0]-a[0]), MV.h/(c[1]-a[1]))*0.7; }
function clampS(s){ return Math.max(sMin()||0.5, Math.min(160, s)); }
function mapGo(s,tx,ty,animate){
  cancelAnimationFrame(MV.anim);
  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(!animate || reduce || !MV.s){ MV.s=s; MV.tx=tx; MV.ty=ty; mapDraw(); mapList(); return; }
  const s0=MV.s, cx0=(MV.w/2-MV.tx)/MV.s, cy0=(MV.h/2-MV.ty)/MV.s, cx1=(MV.w/2-tx)/s, cy1=(MV.h/2-ty)/s;
  const t0=performance.now(), D=380;
  const step = now => { let k=Math.min(1,(now-t0)/D); k = k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    const sk = Math.exp(Math.log(s0)+(Math.log(s)-Math.log(s0))*k), cx=cx0+(cx1-cx0)*k, cy=cy0+(cy1-cy0)*k;
    MV.s=sk; MV.tx=MV.w/2-cx*sk; MV.ty=MV.h/2-cy*sk; mapDraw();
    if(k<1) MV.anim=requestAnimationFrame(step); else mapList(); };
  MV.anim=requestAnimationFrame(step);
}
function zoomAt(f, x, y){ const s=clampS(MV.s*f); const k=s/MV.s; MV.tx = x-(x-MV.tx)*k; MV.ty = y-(y-MV.ty)*k; MV.s=s; }
function focusPoint(p, minS){ const k=P(p.lon,p.lat); const s=clampS(Math.max(MV.s, minS||18)); mapGo(s, MV.w/2-k[0]*s, MV.h*0.45-k[1]*s, true); }
function fitRoute(r){ let lo=[180,90,-180,-90]; r.pts.forEach(([x,y])=>{ lo=[Math.min(lo[0],x),Math.min(lo[1],y),Math.max(lo[2],x),Math.max(lo[3],y)]; }); const m=0.004; mapFit([lo[0]-m,lo[1]-m,lo[2]+m,lo[3]+m], true, 34); }

let measCtx=null;
function textW(t, bold){ try{ if(!measCtx){ measCtx=document.createElement('canvas').getContext('2d'); } measCtx.font=(bold?'600 ':'500 ')+'11.5px "IBM Plex Sans", system-ui, sans-serif'; return measCtx.measureText(t).width; }catch(e){ return t.length*6.4; } }
function mapDraw(){
  const svg=document.getElementById('mapsvg'); if(!svg) return;
  const gg=document.getElementById('mgeo'); gg.setAttribute('transform','matrix('+MV.s.toFixed(4)+',0,0,'+MV.s.toFixed(4)+','+MV.tx.toFixed(1)+','+MV.ty.toFixed(1)+')');
  $$('.m-rt.sel', svg).forEach(e=>e.classList.remove('sel'));
  if(MV.sel && MV.sel.t==='r'){ const e=document.getElementById('rt-'+MV.sel.id); if(e){ e.classList.add('sel'); e.parentNode.appendChild(e); } }
  const W=MV.w, H=MV.h, s=MV.s, out=[], labels=[], boxes=[];
  const scr = (lon,lat) => { const k=P(lon,lat); return [k[0]*s+MV.tx, k[1]*s+MV.ty]; };
  boxes.push([W-58,0,W,160]);
  const bg=[];
  MAPGEO.water.forEach(w=>{ if(w[3]==='small' && s<10) return; if(w[3]==='big' && s>14) return; const [x,y]=scr(w[1],w[2]); bg.push({x,y,t:w[0],cls:'water'+(w[3]?' '+w[3]:''),fs:w[3]==='big'?13:w[3]==='small'?10.5:11.5,sp:w[3]==='big'?2.6:.7}); });
  MAPGEO.land.forEach(w=>{ if(s>9) return; const [x,y]=scr(w[1],w[2]); bg.push({x,y,t:w[0],cls:'landl',fs:12,sp:2.9,up:true}); });
  if(s<9){ [['Woche 1 · Bang Tao',98.31,7.995],['Woche 2 · Khao Lak',98.262,8.66]].forEach(a=>{ const [x,y]=scr(a[1],a[2]); if(x<-100||x>W+100||y<-20||y>H+20) return; labels.push({x:x+16,y:y+4,t:a[0],cls:'area',pr:-1,anchor:'start',force:true}); }); }
  const vis = MAPPTS.filter(p=>MV.layers[p.L] && !(p.L==='essen' && s<6 && !(MV.sel&&MV.sel.id===p.id))).map(p=>{ const [x,y]=scr(p.lon,p.lat); return {p,x,y}; }).filter(o=>o.x>-40&&o.x<W+40&&o.y>-40&&o.y<H+40);
  const order = {base:0,info:1,ziel:2,weg:3,essen:4};
  vis.sort((a,b)=>(order[a.p.L]-order[b.p.L])||(a.p.z-b.p.z));
  const groups=[];
  vis.forEach(o=>{ const sel = MV.sel&&MV.sel.t==='p'&&MV.sel.id===o.p.id; let g = sel?null:groups.find(g=>!g.sel && g.L===o.p.L && Math.hypot(g.x-o.x,g.y-o.y)<20); if(g){ g.m.push(o); } else groups.push({L:o.p.L, x:o.x, y:o.y, m:[o], sel}); });

    const o=g.m[0], p=o.p;
    mks.push([order[p.L], g.sel?1:0, '<g class="mk L-'+p.L+(g.sel?' sel':'')+'" data-mid="'+p.id+'" transform="translate('+o.x.toFixed(1)+','+o.y.toFixed(1)+')">'+(g.sel?'<circle class="ring" r="17"/>':'')+'<circle r="11"/><use href="#mi-'+p.ic+'" x="-7" y="-7" width="14" height="14"/></g>']);

  });
  mks.sort((a,b)=>(b[0]-a[0])||(a[1]-b[1])).forEach(m=>out.push(m[2]));
  labels.sort((a,b)=>a.pr-b.pr);
  const late=[];
  labels.forEach(l=>{
    const w=textW(l.t, true), h=14;
    const cand = l.mk ? [[l.x+15,l.y+4,'start'],[l.x-15,l.y+4,'end'],[l.x,l.y+26,'middle'],[l.x,l.y-17,'middle']] : [[l.x,l.y,l.anchor||'start']];
    for(const [x,y,an] of cand){

      if(!l.force && l.cls!=='sel' && boxes.some(q=>!(b[2]<q[0]||b[0]>q[2]||b[3]<q[1]||b[1]>q[3]))) continue;
      boxes.push(b); out.push('<text class="mlbl '+l.cls+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" text-anchor="'+an+'">'+esc(l.t)+'</text>'); break;
    }
  });
  bg.forEach(l=>{ const w=(l.up?l.t.toUpperCase():l.t).length*(l.fs*0.56+l.sp), b=[l.x-w/2-2,l.y-l.fs,l.x+w/2+2,l.y+4];
    if(b[0]<2||b[2]>W-2||b[1]<2||b[3]>H-2) return; if(boxes.some(q=>!(b[2]<q[0]||b[0]>q[2]||b[3]<q[1]||b[1]>q[3]))) return;
    boxes.push(b); late.push('<text class="mlbl '+l.cls+'" x="'+l.x.toFixed(1)+'" y="'+l.y.toFixed(1)+'" text-anchor="middle">'+esc(l.t)+'</text>'); });
  document.getElementById('mover').innerHTML = late.join('') + out.join('');
  const sc=document.getElementById('mscale'); if(sc){ const nice=[0.2,0.5,1,2,5,10,20,50,100]; const km=nice.find(n=>n*s>=70)||100; sc.querySelector('i').style.width=Math.round(km*s)+'px'; sc.querySelector('span').textContent=(km<1?(km*1000)+' m':km+' km'); }
}

function mapListNow(){

function mapMount(){
  const svg=document.getElementById('mapsvg'), box=document.getElementById('mapbox'); if(!svg||!box) return;
  const r=box.getBoundingClientRect(); MV.w=Math.max(200,r.width); MV.h=Math.max(200,r.height);
  svg.setAttribute('viewBox','0 0 '+MV.w+' '+MV.h);
  MV.view='karte';
  if(!MV.s) mapFit(PRESETS[MV.preset].b,false);
  applyFocus();
  mapDraw(); mapInfo(); mapListNow();
  if(svg.dataset.bound) return; svg.dataset.bound='1';
  svg.addEventListener('pointerdown', mDown); svg.addEventListener('pointermove', mMove);
  svg.addEventListener('pointerup', mUp); svg.addEventListener('pointercancel', mUp);
  svg.addEventListener('wheel', mWheel, {passive:false});
  svg.addEventListener('dblclick', e => { e.preventDefault(); const q=svg.getBoundingClientRect(); zoomAt(2, e.clientX-q.left, e.clientY-q.top); mapDraw(); mapList(); });
  try{ if(MV.ro) MV.ro.disconnect(); MV.ro=new ResizeObserver(()=>{ const b=document.getElementById('mapbox'), sv=document.getElementById('mapsvg'); if(!b||!sv) return; const q=b.getBoundingClientRect(); if(Math.abs(q.width-MV.w)<1&&Math.abs(q.height-MV.h)<1) return; const cx=(MV.w/2-MV.tx)/MV.s, cy=(MV.h/2-MV.ty)/MV.s; MV.w=q.width; MV.h=q.height; sv.setAttribute('viewBox','0 0 '+MV.w+' '+MV.h); MV.tx=MV.w/2-cx*MV.s; MV.ty=MV.h/2-cy*MV.s; mapDraw(); mapList(); }); MV.ro.observe(box); }catch(e){}
}
function applyFocus(){
  if(!MV.focus) return; const f=MV.focus; MV.focus=null;
  if(f.pt){ const p=ptOf(f.pt); if(p){ MV.sel={t:'p',id:p.id}; if(!MV.layers[p.L]) setLayer(p.L,1); focusPoint(p, f.z||18); } }
  else if(f.rt){ const rr=rtOf(f.rt); if(rr){ MV.sel={t:'r',id:rr.id}; if(!MV.layers[rr.L]) setLayer(rr.L,1); fitRoute(rr); } }
  $$('.lchip').forEach(b=>b.setAttribute('aria-pressed', String(!!MV.layers[b.dataset.l])));
}
function setLayer(k,on){ MV.layers[k]=on?1:0; try{ localStorage.setItem('tl-map-layers', JSON.stringify(MV.layers)); }catch(e){} const svg=document.getElementById('mapsvg'); if(svg) svg.classList.toggle('off-'+k, !on); }
function mPos(e){ const q=e.currentTarget.getBoundingClientRect(); return {x:e.clientX-q.left, y:e.clientY-q.top}; }
function mDown(e){
  const svg=e.currentTarget; try{ svg.setPointerCapture(e.pointerId); }catch(err){}
  cancelAnimationFrame(MV.anim);
  const p=mPos(e); MV.ptrs.set(e.pointerId, p);
  if(MV.ptrs.size===1){ MV.drag={x0:p.x,y0:p.y,tx0:MV.tx,ty0:MV.ty,t:performance.now(),moved:false}; MV.pinch=null; }
  else if(MV.ptrs.size===2){ const [a,b]=[...MV.ptrs.values()]; MV.pinch={d0:Math.hypot(a.x-b.x,a.y-b.y)||1, mx:(a.x+b.x)/2, my:(a.y+b.y)/2, s0:MV.s, tx0:MV.tx, ty0:MV.ty}; if(MV.drag) MV.drag.moved=true; }
}
let mRaf=0;
function mMove(e){
  if(!MV.ptrs.has(e.pointerId)) return;
  const p=mPos(e); MV.ptrs.set(e.pointerId, p);
  if(MV.ptrs.size>=2 && MV.pinch){
    const [a,b]=[...MV.ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y)||1, mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const s=clampS(MV.pinch.s0*d/MV.pinch.d0); const wx=(MV.pinch.mx-MV.pinch.tx0)/MV.pinch.s0, wy=(MV.pinch.my-MV.pinch.ty0)/MV.pinch.s0;
    MV.s=s; MV.tx=mx-wx*s; MV.ty=my-wy*s;
  } else if(MV.drag){
    const dx=p.x-MV.drag.x0, dy=p.y-MV.drag.y0; if(Math.abs(dx)+Math.abs(dy)>5) MV.drag.moved=true;
    MV.tx=MV.drag.tx0+dx; MV.ty=MV.drag.ty0+dy;
  } else return;
  if(!mRaf) mRaf=requestAnimationFrame(()=>{ mRaf=0; mapDraw(); });
}
function mUp(e){
  if(!MV.ptrs.has(e.pointerId)) return;
  const p=MV.ptrs.get(e.pointerId); MV.ptrs.delete(e.pointerId);
  if(MV.ptrs.size===1){ const q=[...MV.ptrs.values()][0]; MV.drag={x0:q.x,y0:q.y,tx0:MV.tx,ty0:MV.ty,t:0,moved:true}; MV.pinch=null; return; }
  if(MV.ptrs.size>0) return;
  const d=MV.drag; MV.drag=null; MV.pinch=null;
  if(d && !d.moved && e.type==='pointerup' && performance.now()-d.t<500){
    const now=performance.now();
    if(MV.lastTap && now-MV.lastTap.t<300 && Math.hypot(MV.lastTap.x-p.x,MV.lastTap.y-p.y)<24 && e.pointerType!=='mouse'){ MV.lastTap=null; zoomAt(2,p.x,p.y); mapDraw(); mapList(); return; }
    MV.lastTap={t:now,x:p.x,y:p.y};
    mTap(e.clientX, e.clientY);
  } else mapList();
}
function mTap(cx, cy){
  const el=document.elementFromPoint(cx,cy);
  const mk=el&&el.closest&&el.closest('[data-mid],[data-cl],[data-rid]');
  if(!mk){ if(MV.sel){ MV.sel=null; mapDraw(); mapInfo(); } return; }
  if(mk.dataset.cl!=null){ const ids=MV.clusters[+mk.dataset.cl]||[]; const ps=ids.map(ptOf).filter(Boolean); if(!ps.length) return; let b=[180,90,-180,-90]; ps.forEach(q=>{ b=[Math.min(b[0],q.lon),Math.min(b[1],q.lat),Math.max(b[2],q.lon),Math.max(b[3],q.lat)]; }); const m=0.003, bb=[b[0]-m,b[1]-m,b[2]+m,b[3]+m]; if(fitScale(bb,46)<=MV.s*1.05){ MV.sel={t:'p',id:ids[0]}; mapDraw(); mapInfo(); } else mapFit(bb, true, 46); return; }
  MV.sel = mk.dataset.mid ? {t:'p', id:mk.dataset.mid} : {t:'r', id:mk.dataset.rid};
  mapDraw(); mapInfo();
  const info=document.getElementById('mapinfo'); if(info && info.getBoundingClientRect().top>innerHeight-120) info.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function mWheel(e){ e.preventDefault(); const q=e.currentTarget.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY*(e.deltaMode===1?0.05:0.0016)), e.clientX-q.left, e.clientY-q.top); if(!mRaf) mRaf=requestAnimationFrame(()=>{ mRaf=0; mapDraw(); }); mapList(); }

    '<ol class="adv">'+ADVANCE.map(a=>{ const st=advStatus(a.bk);
      const go = a.go ? '<button class="btn ghost small" data-act="book-seg" data-v="'+a.go+'">Ansehen</button>' : a.exc ? '<button class="btn ghost small" data-act="exc-open" data-x="'+a.exc+'">Ansehen</button>' : '';
      return '<li class="adv-i"><div><b>'+esc(a.t)+'</b><p class="muted small">'+esc(a.why)+'</p></div><div class="adv-r">'+(st?'<span class="pill '+st.cls+' tiny">'+st.label+'</span>':'')+go+'</div></li>'; }).join('')+'</ol>'+
    '<section class="card"><h2>Nicht vergessen</h2><p>Einreisekarte TDAC und Reiseversicherung stehen in der Checkliste.</p><div class="fl-act"><a class="btn ghost small" href="#checkliste">Zur Checkliste</a><a class="btn ghost small" href="#infos-allgemein">Einreise-Infos</a></div></section>';
}
function vBookingsExt(){
  const seg=bookSeg();
  if(S.bookSeg==='liste'){ return vBookings().replace('<div class="view">','<div class="view">'+seg); }
  const body = S.bookSeg==='fluege'?vFlights():S.bookSeg==='hotels'?vHotels():S.bookSeg==='parken'?vPark():vAdvance();
  return '<div class="view">'+storeBanner()+seg+body+'</div>';
}
function listSeg(cur){ return '<div class="seg" style="grid-template-columns:repeat('+LISTS.length+',1fr)" role="group" aria-label="Listen">'+LISTS.map(k=>'<button data-act="list-seg" data-v="'+k+'" aria-pressed="'+(k===cur)+'">'+LIST_LABEL[k]+'</button>').join('')+'</div>'; }
const withListSeg = fn => () => fn().replace('<div class="view">','<div class="view">'+listSeg(S.view));

/* ================================================================ Aktionen & Hooks */
const EXT_VIEWS = { karte:vMap, entdecken:vExplore, buchungen:vBookingsExt, packliste:withListSeg(vPacking), checkliste:withListSeg(vChecklist), budget:withListSeg(vBudget) };
const EXT_ACT = {
  'map-preset': el => { MV.preset=el.dataset.p; $$('[data-act="map-preset"][aria-pressed]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.p===MV.preset))); mapFit(PRESETS[MV.preset].b, true); },
  'map-layer': el => { const k=el.dataset.l; setLayer(k, !MV.layers[k]); el.setAttribute('aria-pressed', String(!!MV.layers[k])); if(MV.sel){ const it=MV.sel.t==='p'?ptOf(MV.sel.id):rtOf(MV.sel.id); if(it&&!MV.layers[it.L]){ MV.sel=null; mapInfo(); } } mapDraw(); mapList(); },
  'map-reset': () => { mapFit(PRESETS[MV.preset].b, true); },
  'map-zoom': el => { const f=+el.dataset.z; const s=clampS(MV.s*f), cx=(MV.w/2-MV.tx)/MV.s, cy=(MV.h/2-MV.ty)/MV.s; mapGo(s, MV.w/2-cx*s, MV.h/2-cy*s, true); },
  'map-sel': el => { if(el.dataset.pt){ const p=ptOf(el.dataset.pt); MV.sel={t:'p',id:p.id}; focusPoint(p, Math.max(MV.s,12)); } else { const r=rtOf(el.dataset.rt); MV.sel={t:'r',id:r.id}; fitRoute(r); } mapInfo(); document.getElementById('mapbox')?.scrollIntoView({behavior:'smooth',block:'start'}); },
  'map-clear': () => { MV.sel=null; mapDraw(); mapInfo(); },
  'map-fitrt': el => { const r=rtOf(el.dataset.rt); if(r) fitRoute(r); },
  'map-focus': el => { MV.focus = el.dataset.pt ? {pt:el.dataset.pt, z:+el.dataset.z||18} : {rt:el.dataset.rt}; if(location.hash!=='#karte') location.hash='karte'; else { applyFocus(); mapDraw(); mapInfo(); } },
  'exc-open': el => { S.excFilter='alle'; S.excScroll=el.dataset.x; if(location.hash!=='#entdecken') location.hash='entdecken'; else { render(); extAfter(); } },
  'exc-filter': el => { S.excFilter=el.dataset.k; render(); },
  'exc-bk': (el,e) => { e.preventDefault(); S.bookSeg='liste'; location.hash='buchungen'; render(); },
  'book-seg': el => { S.bookSeg=el.dataset.v; if(location.hash!=='#buchungen'){ history.replaceState(null,'','#buchungen'); S.view='buchungen'; } render(); window.scrollTo(0,0); },
  'list-seg': el => { location.hash=el.dataset.v; },
  'ht-pick': async el => { const H=hotelOf(el.dataset.id); if(!H) return; const st=STAY[H.w];
    const ok=await confirmSheet(H.name+' wählen?', 'Titel, Ort und Link von «Unterkunft '+(H.w==='w1'?'Woche 1':'Woche 2')+'» werden ersetzt. Status, Kosten, Notizen und Dateien bleiben.', 'Übernehmen'); if(!ok) return;
    const cur=itemOf('bookings',st.bk); const base=cur?{}:{kind:'unterkunft', status:'offen', currency:'CHF', budgetCat:'unterkunft', dateFrom:st.from, dateTo:st.to, files:[], deleted:false, order:maxOrder('bookings')+10, conf:'', cost:null, notes:''};
    if(await patch('bookings',{items:{[st.bk]:Object.assign(base,{title:'Unterkunft '+(H.w==='w1'?'Woche 1':'Woche 2')+' · '+H.name, route:st.nights+' Nächte · '+H.addr, link:bookingUrl(H.q,st.from,st.to), variant:H.id}, stamp())}})) toast('Übernommen: '+H.name); },
  'fl-apply': async el => { const f=FLIGHTS.find(x=>x.id===el.dataset.id); if(!f||!f.apply) return;
    const ok=await confirmSheet('Flüge übernehmen?', 'Titel, Strecke und Datum der betroffenen Flüge in «Liste» werden ersetzt ('+f.airline+' ab '+f.from+'). Status, Kosten und Dateien bleiben.', 'Übernehmen'); if(!ok) return;
    const its={}; Object.entries(f.apply).forEach(([id,v])=>{ its[id]=Object.assign({},v,stamp()); });
    if(await patch('bookings',{items:its})) toast('Flüge übernommen'); },
  'bk-tpl': el => { const x=el.dataset.x; let tpl=null;
    if(x==='park') tpl={kind:'transfer', title:'Parkplatz Malpensa', route:'MXP Terminal 1 · 14 Tage', dateFrom:'2027-02-13', dateTo:'2027-02-27', budgetCat:'transport', notes:'Abfahrt rechtzeitig für TG941 um 13:05; Abholung nach der Landung um 07:10.'};
    else { const X=excOf(x); if(X&&X.tpl) tpl=Object.assign({budgetCat:'ausfluege'},X.tpl); }
    if(tpl) editBooking(null, tpl); }
};
function extAfter(){
  if(S.view!=='karte') MV.view=S.view;
  if(S.view==='karte') mapMount();
  if(S.view==='entdecken' && S.excScroll){ const id=S.excScroll; S.excScroll=null; requestAnimationFrame(()=>{ const el=document.getElementById('x-'+id); if(el) el.scrollIntoView({block:'start'}); }); }
  if(LISTS.includes(S.view)) S.lastList=S.view;
}
function extKeep(){ if(S.view==='karte' && MV.view==='karte' && document.getElementById('mapsvg')){ mapDraw(); mapInfo(); return true; } return false; }

/* ================================================================ Sheets */
let SHEET=null;
function openSheet(title, body, o={}){
  const root=$('#sheet-root');
  root.innerHTML = '<div class="scrim" data-act="sheet-close"></div><form class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" novalidate><header><h2 id="sheet-title">'+esc(title)+'</h2><button type="button" class="icon-btn" data-act="sheet-close" aria-label="Schliessen">×</button></header><div class="sheet-body">'+body+'</div><footer>'+(o.danger?'<button type="button" class="btn ghost danger small" data-act="sheet-danger">'+esc(o.danger.label)+'</button>':'')+'<span class="sp"></span>'+(o.noCancel?'':'<button type="button" class="btn ghost small" data-act="sheet-close">'+esc(o.cancelLabel||'Abbrechen')+'</button>')+(o.onSubmit||o.submitLabel?'<button type="submit" class="btn small">'+esc(o.submitLabel||'Speichern')+'</button>':'')+'</footer></form>';
  root.classList.add('open'); document.body.classList.add('noscroll');
  SHEET = o; SHEET.prevFocus = document.activeElement;
  const form = root.querySelector('form');
  form.addEventListener('submit', async e => { e.preventDefault(); const btn=form.querySelector('[type=submit]'); if(btn) btn.disabled=true; let ok=true; try{ if(o.onSubmit) ok = await o.onSubmit(form); }catch(err){ console.error(err); ok=false; } if(btn) btn.disabled=false; if(ok!==false) closeSheet(true); });
  setTimeout(()=>{ const f = o.focusSel ? form.querySelector(o.focusSel) : form.querySelector('.sheet-body input:not([type=hidden]),.sheet-body textarea,.sheet-body select'); if(f && !matchMedia('(pointer:coarse)').matches) f.focus(); else form.querySelector('[data-act="sheet-close"].icon-btn')?.focus(); }, 40);
}
function closeSheet(ok){ const root=$('#sheet-root'); if(!root.classList.contains('open')) return; const o=SHEET; root.classList.remove('open'); root.innerHTML=''; document.body.classList.remove('noscroll'); SHEET=null; if(o&&o.onClose) o.onClose(!!ok); try{ o&&o.prevFocus&&o.prevFocus.focus&&o.prevFocus.focus({preventScroll:true}); }catch(e){} if(deferred){ deferred=false; render(); } }
function confirmSheet(title, text, yes){ return new Promise(res => { let answered=false; openSheet(title, '<p>'+esc(text)+'</p>', { submitLabel:yes, cancelLabel:'Abbrechen', onSubmit: async ()=>{ answered=true; res(true); return true; }, onClose: ok => { if(!answered) res(false); } }); }); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'), 2600); }

/* ================================================================ Ereignisse */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act;
  switch(a){
    case 'sheet-close': e.preventDefault(); closeSheet(false); break;
    case 'sheet-danger': { const o=SHEET; closeSheet(false); if(o&&o.danger) o.danger.fn(); break; }
    case 'goday': e.preventDefault(); S.scrollTo = el.dataset.day; if(location.hash!=='#tage') location.hash='tage'; else applyRoute(); break;
    case 'bk-new': editBooking(null); break;
    case 'bk-edit': editBooking(el.dataset.id); break;
    case 'bk-filter': S.bookFilter = el.dataset.k; render(); break;
    case 'bk-status': { const b=itemOf('bookings',el.dataset.id); if(!b) break; const nx=STATUS_NEXT[b.status]||'reserviert'; await patch('bookings',{items:{[el.dataset.id]:Object.assign({status:nx},stamp())}}); break; }
    case 'copy': try{ await navigator.clipboard.writeText(el.dataset.v); toast('Kopiert'); }catch(err){ toast('Kopieren nicht möglich – bitte markieren.'); } break;
    case 'file-view': openSheet(el.dataset.name||'Bild', '<img class="lightbox" src="'+esc(el.dataset.url)+'" alt="'+esc(el.dataset.name||'')+'">', {cancelLabel:'Schliessen'}); break;
    case 'file-del': deleteFile(el.dataset.id, el.dataset.fid); break;
    case 'day-edit': editDay(el.dataset.day); break;
    case 'sess-done': { const iso=el.dataset.day, sid=el.dataset.sid; const d=dayOf(iso); const s=d&&Array.isArray(d.sessions)?d.sessions.find(x=>x.id===sid):null; if(!s) break; const t=tickOf('days', iso+'|'+sid, s); await setTick('days', iso+'|'+sid, !t.done); break; }
    case 'sess-add': { const list=$('#sess-list'); if(list){ list.insertAdjacentHTML('beforeend', sessRow({id:uid(), sport:'rad', min:null, ort:'', details:'', alt:''})); } break; }
    case 'sess-del': el.closest('.sedit')?.remove(); break;
    case 'info-region': S.infoRegion = el.dataset.r; history.replaceState(null,'','#infos-'+el.dataset.r); render(); window.scrollTo(0,0); break;
    case 'info-jump': document.getElementById(el.dataset.id)?.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth', block:'start'}); break;
    case 'show-th': openSheet(el.dataset.name||'Ort', '<p class="th-big" lang="th">'+esc(el.dataset.th)+'</p><p class="muted" style="text-align:center">'+esc(el.dataset.name||'')+'</p>', {cancelLabel:'Fertig'}); break;
    case 'exp-new': editExpense(); break;
    case 'exp-del': { const ok=await confirmSheet('Ausgabe löschen?','Diese Ausgabe wird für euch beide entfernt.','Löschen'); if(ok) await patch('expenses',{items:{[el.dataset.id]:Object.assign({deleted:true},stamp())}}); break; }
    case 'pack-toggle': { const p=itemOf('packing',el.dataset.id); if(!p) break; const t=tickOf('packing',el.dataset.id,p); await setTick('packing', el.dataset.id, !t.done); break; }
    case 'pack-del': { const p=itemOf('packing',el.dataset.id); if(!p) break; const ok=await confirmSheet('Punkt entfernen?','«'+(p.text||'')+'» wird für euch beide entfernt.','Entfernen'); if(ok) await patch('packing',{items:{[el.dataset.id]:Object.assign({deleted:true},stamp())}}); break; }
    case 'pack-add': addPack(el.dataset.cat); break;
    case 'check-toggle': { const c=itemOf('checklist',el.dataset.id); if(!c) break; const t=tickOf('checklist',el.dataset.id,c); await setTick('checklist', el.dataset.id, !t.done); break; }
    case 'check-edit': editCheck(el.dataset.id); break;
    case 'check-new': editCheck(null); break;
    case 'lock-set': editLock(); break;
    case 'lock-off': lockOff(); break;
    case 'relock': forgetUnlock(); if(SHEET) closeSheet(false); render(); window.scrollTo(0,0); break;
    default: if(EXT_ACT[a]) await EXT_ACT[a](el,e);
  }
});
document.addEventListener('submit', e => { if(e.target && e.target.id==='lock-form'){ e.preventDefault(); tryUnlock(); } });
document.addEventListener('keydown', e => {
  if(e.key==='Escape' && SHEET){ closeSheet(false); return; }
  const el=e.target; if(e.key==='Enter' && el && el.dataset && el.dataset.act==='pack-input'){ e.preventDefault(); addPack(el.dataset.cat); }
});
document.addEventListener('change', async e => {
  const el=e.target; if(!el||!el.dataset) return; const a=el.dataset.act;
  if(a==='bk-file'){ const files=el.files; await uploadFiles(el.dataset.id, files); el.value=''; return; }
  if(a==='note'){ const v=el.value; if(sensitive(v)){ toast('Bitte keine Karten- oder Passnummern speichern.'); return; } if(await patch('notes',{[el.dataset.k]:v})) toast('Notiz gespeichert'); return; }
  if(a==='bikefit'){ if(await patch('bikefit',{[el.dataset.k]:el.value.trim()})) toast('Gespeichert'); return; }
  if(a==='plan'){ const n=parseAmount(el.value); if(Number.isNaN(n)){ toast('Bitte eine Zahl eingeben.'); return; } await patch('budget',{cats:{[el.dataset.k]:{plan:n}}}); return; }
  if(a==='fx'){ const n=parseAmount(el.value); if(!n||Number.isNaN(n)){ toast('Bitte einen Kurs > 0 eingeben.'); return; } if(await patch('budget',{fxRate:n})) toast('Kurs gespeichert'); return; }
});

/* ================================================================ Start */
function readHash(){ const h=(location.hash||'').slice(1); if(h.indexOf('infos-')===0){ const r=h.slice(6); if(INFO[r]) S.infoRegion=r; return 'infos'; } if(h==='listen') return S.lastList||'packliste'; if(h.indexOf('buchungen-')===0){ const b=h.slice(10); if(BSEG.some(x=>x[0]===b)) S.bookSeg=b; return 'buchungen'; } return VIEWS.includes(h)?h:'uebersicht'; }
function applyRoute(){ S.view=readHash(); const target=S.scrollTo; S.scrollTo=null; if(SHEET) closeSheet(false); render(); if(target && S.view==='tage'){ requestAnimationFrame(()=>{ const el=document.getElementById('d-'+target); if(el) el.scrollIntoView({block:'start'}); }); } else window.scrollTo(0,0); }
window.addEventListener('hashchange', applyRoute);
function start(data){
  if(data && typeof data==='object'){ if(data.infoRegion && INFO[data.infoRegion]) S.infoRegion=data.infoRegion; if(data.bookFilter) S.bookFilter=data.bookFilter; }
  S.view = readHash(); render(); connect();
  if(S.view==='tage'){ const t=todayZurich(); if(t>=TRIP.start&&t<=TRIP.end) S.scrollTo=t; }
}
try{ window.claude?.hot?.snapshot?.(() => ({infoRegion:S.infoRegion, bookFilter:S.bookFilter})); }catch(e){}
try{ if(window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {}); }catch(e){ start({}); }
})();
</script>
<script>if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){ addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }</script>
